spring:
  ai:
    openai:
      # 假 Key：仅为让自动装配通过；测试中不做真实调用
      # 若设置了环境变量 SPRING_AI_OPENAI_API_KEY，它会覆盖此值（环境变量优先级高于 yml），
      # 此时 VectorStoreSmokeTest 中需要真实 API 的用例会自动启用
      api-key: test-key-not-used
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: hnsw
        distance-type: cosine_distance
        table-name: vector_store_test
  datasource:
    url: jdbc:postgresql://localhost:5432/finagent
    username: finagent
    password: finagent
    hikari:
      # 测试里 14 种 Spring 上下文同时存活，每个默认开 10 条连接 → 会打满 PG 的 100 连接
      # （实测 FATAL: sorry, too many clients already）。测试不需要并发池，压到 4。
      maximum-pool-size: 4
      minimum-idle: 0

finagent:
  # 记忆默认关掉：会话类测试自己显式打开（properties = "finagent.memory.enabled=true"），
  # 这样其余 300+ 用例的 Prompt 与阶段 8 完全一致。
  memory:
    enabled: false
  chat:
    # 测试不写 logs/chat-trace.jsonl，避免每跑一次测试就往仓库里加文件
    trace-file: target/test-chat-trace.jsonl
  tenant:
    # 测试 profile 关闭认证：300+ 个既有测试不关心身份，逐个造 token 会淹没被测逻辑。
    # 代价是「测试环境不验认证」，所以认证由 AuthenticationFilterTest 覆盖，
    # 跨租户隔离与 ACL 由 rls profile 的 RlsEnforcementTest / TenantIsolationE2ETest 覆盖。
    auth-enabled: false
    # 同理关掉 ACL（否则每个聊天类测试都要先造授权行）。
    # 真实 ACL 由 AclScopeAuthorizerTest（本文件里用 properties 单独打开开关）与阶段 8 越权 e2e 覆盖。
    acl-enabled: false
